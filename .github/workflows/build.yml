
name: Build and update block release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows EXE and update block release
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: |
          python -m PyInstaller --clean --noconfirm --windowed --onefile --name Minecraft-Raider main.py

      - name: Remove previous release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $assets = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/block" --jq '.assets[].id'

          foreach ($assetId in $assets) {
            if ($assetId) {
              gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/releases/assets/$assetId"
              if ($LASTEXITCODE -ne 0) {
                throw "Failed to delete release asset $assetId"
              }
            }
          }

      - name: Upload new executable to block release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: block
          files: dist/Minecraft-Raider.exe
          overwrite_files: true
          fail_on_unmatched_files: true
